<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VS Code Config AiNge</title>
  <style type="text/css">
    * { box-sizing:border-box; }
    body { margin:0; padding:18px; background:#f2f5f7; color:#263238; font-family:'Segoe UI',Arial,sans-serif; }
    h1 { margin:0 0 6px 0; color:#174a5b; font-size:23px; }
    p { font-size:13px; margin:4px 0 12px 0; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:end; padding:12px; background:#fff; border:1px solid #cad5da; border-radius:7px; }
    .control { min-width:180px; flex:1; }
    label { display:block; font-size:12px; font-weight:700; margin-bottom:4px; }
    input, select { width:100%; padding:7px; border:1px solid #aebdc4; border-radius:4px; background:#fff; }
    button { padding:8px 14px; border:0; border-radius:4px; background:#147d92; color:#fff; cursor:pointer; }
    button.secondary { background:#64747c; }
    .status { margin:10px 0; padding:8px 11px; background:#e6f3f5; border-left:4px solid #147d92; font-size:12px; }
    .blade-container { display:flex; min-height:520px; border:1px solid #b8c6cb; border-radius:7px; overflow:hidden; background:#fff; }
    .blade { display:flex; flex-direction:column; min-width:0; border-right:1px solid #cbd5d9; }
    .blade:last-child { border-right:0; }
    .blade-left { width:235px; background:#173b46; color:#eef7f8; }
    .blade-center { flex:1; background:#fbfcfc; }
    .blade-right { width:330px; background:#fff; }
    .blade-header { padding:11px 13px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid #cbd5d9; }
    .blade-left .blade-header { color:#8ed3dc; border-color:#2d5c66; }
    .blade-center .blade-header { color:#174a5b; }
    .blade-right .blade-header { color:#8a4c12; }
    .blade-body { flex:1; overflow:auto; }
    .source-item, .recommendation { padding:9px 12px; border-bottom:1px solid #e3eaed; font-size:12px; }
    .source-item { cursor:pointer; color:#e9f6f7; border-color:#28535e; }
    .source-item:hover, .source-item.selected { background:#245866; }
    .source-item strong, .recommendation strong { display:block; margin-bottom:3px; }
    .source-meta { color:#a9c8cc; font-size:11px; }
    .recommendation { color:#34474e; }
    .recommendation .meta { color:#8a4c12; font-size:11px; }
    table { width:100%; border-collapse:collapse; font-size:11px; }
    th, td { padding:7px 8px; border-bottom:1px solid #e1e8eb; text-align:left; vertical-align:top; }
    th { position:sticky; top:0; background:#dcebed; color:#174a5b; }
    .status-ADDED { color:#147d45; font-weight:700; } .status-REMOVED { color:#b33a3a; font-weight:700; }
    .status-CHANGED { color:#9a6400; font-weight:700; } .status-UNAVAILABLE { color:#7a4b8d; font-weight:700; }
    .empty { padding:20px; color:#718087; font-size:12px; }
    @media (max-width:900px) { .blade-container { flex-direction:column; } .blade-left,.blade-right { width:100%; min-height:180px; } .blade-center { min-height:300px; } }
  </style>
</head>
<body>
<h1>VS Code Config AiNge</h1>
<p>Install-default, current user, and current workspace configuration comparison.</p>
<div class="toolbar">
  <div class="control"><label for="reportFile">Report JSON</label><input id="reportFile" type="file" accept=".json" /></div>
  <div class="control"><label for="scopeFilter">Scope</label><select id="scopeFilter"><option value="combined">Combined</option><option value="user">User</option><option value="workspace">Workspace</option></select></div>
  <div class="control"><label for="categoryFilter">Config AiNge category</label><select id="categoryFilter"><option value="all">All</option><option value="feature">Feature</option><option value="menu">Menu</option><option value="nature">Nature</option><option value="security hardening">Security hardening</option><option value="feature development">Feature development</option><option value="newly added configs/parameters">Newly added configs/parameters</option></select></div>
  <div class="control"><label for="textFilter">Filter</label><input id="textFilter" type="text" placeholder="key path or recommendation" /></div>
  <button id="loadButton" type="button">Load report</button><button id="clearButton" class="secondary" type="button">Clear</button>
</div>
<div id="status" class="status">Choose a report generated by Export-VsCodeConfigCoverage.ps1.</div>
<div class="blade-container">
  <div class="blade blade-left"><div class="blade-header">Source and filters</div><div id="sourceBlade" class="blade-body"><div class="empty">No report loaded.</div></div></div>
  <div class="blade blade-center"><div class="blade-header">Side-by-side comparison</div><div id="comparisonBlade" class="blade-body"><div class="empty">No report loaded.</div></div></div>
  <div class="blade blade-right"><div class="blade-header">Config AiNge recommendations</div><div id="recommendationBlade" class="blade-body"><div class="empty">No report loaded.</div></div></div>
</div>
<script type="text/javascript">
//<![CDATA[
var currentReport = null;
var currentFile = null;
var asArray = function(value) { return value == null ? [] : (Array.isArray(value) ? value : [value]); };
var escapeHtml = function(value) { return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
var filteredRows = function() {
  if (!currentReport || !currentReport.Comparison) { return []; }
  var scope = document.getElementById('scopeFilter').value;
  var text = document.getElementById('textFilter').value.toLowerCase();
  return asArray(currentReport.Comparison.Rows).filter(function(row) { return (scope === 'combined' || row.Scope === scope) && (!text || String(row.KeyPath).toLowerCase().indexOf(text) >= 0 || String(row.Status).toLowerCase().indexOf(text) >= 0); });
};
var render = function() {
  var rows = filteredRows();
  var category = document.getElementById('categoryFilter').value;
  var recs = asArray(currentReport && currentReport.Recommendations).filter(function(item) { return (category === 'all' || item.Category === category); });
  var text = document.getElementById('textFilter').value.toLowerCase();
  recs = recs.filter(function(item) { return !text || String(item.KeyPath).toLowerCase().indexOf(text) >= 0 || String(item.Recommendation).toLowerCase().indexOf(text) >= 0; });
  document.getElementById('sourceBlade').innerHTML = '<div class="source-item selected"><strong>Scope: ' + escapeHtml(document.getElementById('scopeFilter').value) + '</strong><span class="source-meta">Rows: ' + rows.length + '</span></div><div class="source-item"><strong>Install default</strong><span class="source-meta">Redacted source baseline</span></div><div class="source-item"><strong>Current user</strong><span class="source-meta">Stable and Insiders</span></div><div class="source-item"><strong>Current workspace</strong><span class="source-meta">Stable and Insiders</span></div>';
  var html = '<table><thead><tr><th>Scope</th><th>Channel</th><th>Key path</th><th>Status</th><th>Install default</th><th>Current</th></tr></thead><tbody>';
  rows.forEach(function(row) { html += '<tr><td>' + escapeHtml(row.Scope) + '</td><td>' + escapeHtml(row.Channel) + '</td><td>' + escapeHtml(row.KeyPath) + '</td><td class="status-' + escapeHtml(row.Status) + '">' + escapeHtml(row.Status) + '</td><td>' + escapeHtml(row.ReferenceValue) + '</td><td>' + escapeHtml(row.CurrentValue) + '</td></tr>'; });
  document.getElementById('comparisonBlade').innerHTML = rows.length ? html + '</tbody></table>' : '<div class="empty">No comparison rows match the filters.</div>';
  document.getElementById('recommendationBlade').innerHTML = recs.length ? recs.map(function(item) { return '<div class="recommendation"><strong>' + escapeHtml(item.Title) + '</strong><div class="meta">' + escapeHtml(item.Category) + ' | ' + escapeHtml(item.Priority) + ' | ' + escapeHtml(item.Scope) + '</div><div>' + escapeHtml(item.Recommendation) + '</div></div>'; }).join('') : '<div class="empty">No recommendations match the filters.</div>';
};
document.getElementById('loadButton').onclick = function() { if (!currentFile) { document.getElementById('status').textContent = 'Select a report JSON file first.'; return; } var reader = new FileReader(); reader.onload = function() { try { currentReport = JSON.parse(reader.result); document.getElementById('status').textContent = 'Loaded ' + currentFile.name + '. Secret-shaped values are expected to be redacted.'; render(); } catch (error) { document.getElementById('status').textContent = 'Report load failed: ' + error.message; } }; reader.readAsText(currentFile); };
document.getElementById('reportFile').onchange = function(event) { currentFile = event.target.files && event.target.files.length ? event.target.files[0] : null; };
document.getElementById('clearButton').onclick = function() { currentReport = null; currentFile = null; document.getElementById('reportFile').value = ''; document.getElementById('sourceBlade').innerHTML = '<div class="empty">No report loaded.</div>'; document.getElementById('comparisonBlade').innerHTML = '<div class="empty">No report loaded.</div>'; document.getElementById('recommendationBlade').innerHTML = '<div class="empty">No report loaded.</div>'; };
document.getElementById('scopeFilter').onchange = render; document.getElementById('categoryFilter').onchange = render; document.getElementById('textFilter').oninput = render;
//]]>
</script>
</body>
</html>
