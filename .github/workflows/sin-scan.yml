# VersionTag: 2605.B5.V46.1
name: SIN Pattern Scan
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'logs/**'
      - 'temp/**'
      - 'reports/**'
      - 'Report/**'
      - 'checkpoints/**'
      - 'pki/**'
      - 'sovereign-kernel/**'
      - '.history/**'
      - '.snapshots/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'logs/**'
      - 'temp/**'
      - 'reports/**'
      - 'Report/**'
      - 'checkpoints/**'
      - 'pki/**'
      - 'sovereign-kernel/**'
      - '.history/**'
      - '.snapshots/**'
  workflow_dispatch:

jobs:
  sin-scan:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable | Format-List

      - name: Run SIN scanner (Permissive ratchet)
        shell: pwsh
        run: |
          ./tests/Invoke-SINPatternScanner.ps1 `
            -Runtime Both `
            -RatchetMode Permissive `
            -BaselineJson config/sin-baseline.json `
            -OutputJson reports/sin-scan-permissive.json `
            -FailOnCritical
        continue-on-error: false

      - name: Convert scan to JUnit XML
        if: always()
        shell: pwsh
        run: |
          ./tests/Convert-SinScanToJUnit.ps1 `
            -ScanJson     reports/sin-scan-permissive.json `
            -BaselineJson config/sin-baseline.json `
            -OutputXml    reports/sin-scan-junit.xml

      - name: Sanitize scan artifacts for GitHub upload
        if: always()
        shell: pwsh
        run: |
          ./scripts/Protect-SinScanArtifact.ps1 -ScanJson reports/sin-scan-permissive.json

      - name: Run pipeline continuous refine scan
        if: always()
        shell: pwsh
        run: |
          ./scripts/Invoke-ValidateCanonicalPaths.ps1 `
            -WorkspacePath . `
            -RegistryPath config/pipeline-canonical-paths.json `
            -FailOnMissing

          ./scripts/Invoke-PipelineContinuousRefine.ps1 `
            -WorkspacePath . `
            -OutputRoot reports/pipeline-refine `
            -BaselineProfile full `
            -BaselineJson config/pipeline-refine-baseline-full.json `
            -FailOnDrift

      - name: Upload SIN scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sin-scan-results
          path: |
            reports/sin-scan-permissive.json
            reports/sin-scan-junit.xml
            reports/pipeline-refine/pipeline-refine-latest.json
            reports/pipeline-refine/pipeline-refine-latest.md
            reports/pipeline-refine/pipeline-refine-trend.jsonl
            reports/pipeline-refine/pipeline-refine-trend-latest.md
            reports/pipeline-refine/pipeline-refine-weekly-rollup.md
          retention-days: 7

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: SIN Pattern Scan
          path: reports/sin-scan-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Auto-create bugs from CRITICAL SIN findings
        if: always()
        shell: pwsh
        run: |
          # Wire Convert-SinScanToBugs.ps1 to turn CRITICAL findings into BUG-*.json
          $scanJson = 'reports/sin-scan-permissive.json'
          if (Test-Path -LiteralPath $scanJson) {
            & ./scripts/Convert-SinScanToBugs.ps1 `
              -WorkspacePath . `
              -ScanResultsPath $scanJson `
              -SeverityFilter @('CRITICAL','Blocking') `
              -Apply `
              -MaxItems 30
            Write-Host "Bug creation from SIN scan complete." -ForegroundColor Green
          } else {
            Write-Host "SIN scan output not found; skipping bug creation."
          }
        continue-on-error: true

  # Non-PS asset coverage: .xhtml/.js/.bat/.cmd/.json patterns (P032/P033/P034-XHTML,
  # P059-P062, P067, P081, P082) never fire under the default *.ps1/*.psm1 discovery.
  # Runs advisory-only until the extended baseline has been recorded, then ratchets.
  sin-scan-extended:
    name: SIN Extended Asset Scan (advisory)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SIN scanner over non-PowerShell assets
        shell: pwsh
        run: |
          ./tests/Invoke-SINPatternScanner.ps1 `
            -Runtime Both `
            -ExtraExtensions .xhtml,.js,.bat,.cmd,.json `
            -RatchetMode Permissive `
            -BaselineJson config/sin-baseline-extended.json `
            -OutputJson reports/sin-scan-extended.json
        continue-on-error: true

      - name: Sanitize extended scan artifact
        if: always()
        shell: pwsh
        run: |
          ./scripts/Protect-SinScanArtifact.ps1 -ScanJson reports/sin-scan-extended.json

      - name: Upload extended scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sin-scan-extended
          path: reports/sin-scan-extended.json
          retention-days: 14

  refine-smoke-matrix:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - name: Refine smoke run on matrix engine
        shell: pwsh
        run: |
          if ('${{ matrix.engine }}' -eq 'powershell') {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Invoke-PipelineContinuousRefine.ps1 `
              -WorkspacePath . `
              -StagedOnly `
              -BaselineProfile staged `
              -BaselineJson .\config\pipeline-refine-baseline-staged.json `
              -OutputRoot .\reports\pipeline-refine-smoke
          } else {
            pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\Invoke-PipelineContinuousRefine.ps1 `
              -WorkspacePath . `
              -StagedOnly `
              -BaselineProfile staged `
              -BaselineJson .\config\pipeline-refine-baseline-staged.json `
              -OutputRoot .\reports\pipeline-refine-smoke
          }

  pester-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Run full test suite (Run-AllTests.ps1)
        shell: pwsh
        env:
          KILLSWITCH_NO_SELFTERMINATE: '1'
        run: |
          $result = & ./tests/Run-AllTests.ps1 `
            -RequirePester $true `
            -IncludeModuleValidation `
            -PesterOnly
          if ($result -and $result.PSObject.Properties.Name -contains 'summary') {
            $failed = [int]$result.summary.failed
            Write-Host "Tests: total=$($result.summary.total) passed=$($result.summary.passed) failed=$failed"
            if ($failed -gt 0) { exit 1 }
          }
