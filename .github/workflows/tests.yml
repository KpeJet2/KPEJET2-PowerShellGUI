# VersionTag: 2607.B7.V46.1
# feature:pipeline feature:stability phase:verify
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC for full pipeline convergence check
    - cron: '0 2 * * *'

jobs:
  # ── Full Pester suite via Run-AllTests.ps1 ────────────────────────────────
  pester-full:
    name: Full Pester Suite
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
            Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run all tests (Run-AllTests.ps1)
        shell: pwsh
        env:
          KILLSWITCH_NO_SELFTERMINATE: '1'
        run: |
          $result = & ./tests/Run-AllTests.ps1 `
            -RequirePester $true `
            -IncludeModuleValidation `
            -PesterOnly

          if ($result -and $result.PSObject.Properties.Name -contains 'summary') {
            $failed = [int]$result.summary.failed
            Write-Host "Tests: total=$($result.summary.total) passed=$($result.summary.passed) failed=$failed"
            if ($failed -gt 0) { exit 1 }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: |
            testResults.xml
            todo/test-results-history.json
          retention-days: 14

  # ── Cert/Approvals contract + deterministic iteration gate ───────────────
  cert-approvals-contract:
    name: Cert/Approvals Contracts + 3-Pass Iteration
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0' })) {
            Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Run cert/approvals contract tests
        shell: pwsh
        run: |
          $tests = @(
            './tests/Start-LocalWebEngine.Tests.ps1',
            './tests/CertHubAndApprovalsSurface.Tests.ps1'
          )
          $r = Invoke-Pester -Path $tests -Output Detailed -PassThru
          if ($null -eq $r -or [int]$r.FailedCount -gt 0) {
            Write-Host "::error::Cert/approvals contract tests failed."
            exit 1
          }

      - name: Dual-engine parser smoke (PS7 + PS5.1)
        shell: pwsh
        run: |
          $targets = @(
            'scripts/Start-LocalWebEngine.ps1',
            'tests/Start-LocalWebEngine.Tests.ps1',
            'tests/CertHubAndApprovalsSurface.Tests.ps1'
          )

          $failedPwsh = @()
          foreach ($t in $targets) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $t), [ref]$tokens, [ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) {
              $failedPwsh += $t
            }
          }
          if (@($failedPwsh).Count -gt 0) {
            Write-Host "::error::PS7 parser errors in: $($failedPwsh -join ', ')"
            exit 1
          }

          $ps51Cmd = '$ErrorActionPreference = ''Stop''; $targets = @(''scripts/Start-LocalWebEngine.ps1'',''tests/Start-LocalWebEngine.Tests.ps1'',''tests/CertHubAndApprovalsSurface.Tests.ps1''); $failed = @(); foreach ($t in $targets) { $tok = $null; $err = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $t), [ref]$tok, [ref]$err) | Out-Null; if (@($err).Count -gt 0) { $failed += $t } }; if (@($failed).Count -gt 0) { Write-Error (''PS5.1 parser errors in: '' + ($failed -join '', '')); exit 1 }'
          powershell -NoProfile -ExecutionPolicy Bypass -Command $ps51Cmd

      - name: Run deterministic 3-pass iteration check
        shell: pwsh
        run: |
          $result = & ./scripts/Invoke-PipelineMultiPass.ps1 `
            -WorkspacePath . `
            -MinPasses 3 `
            -MaxPasses 3 `
            -NoFix `
            -NoPipelineDry `
            -NoSinScan

          if ($null -eq $result -or [int]$result.passesRun -lt 3) {
            Write-Host "::error::Multi-pass did not execute required 3 passes."
            exit 1
          }

          $drift = @($result.passes | Where-Object {
            $_.PSObject.Properties.Name -contains 'driftRegression' -and $_.driftRegression -eq $true
          })
          if (@($drift).Count -gt 0) {
            Write-Host "::error::DRIFT-REGRESSION detected in $(@($drift).Count) pass(es)."
            exit 1
          }

          Write-Host "3-pass iteration gate passed." -ForegroundColor Green

      - name: Upload iteration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cert-approvals-iteration-report
          path: reports/interop-iter/multipass-*.json
          retention-days: 14

  # ── Nightly multi-pass pipeline convergence check ─────────────────────────
  # Runs Invoke-PipelineMultiPass.ps1 in read-only mode; treats an increase in
  # findings vs the last run as DRIFT-REGRESSION.
  nightly-convergence:
    name: Nightly Convergence Check
    runs-on: windows-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run pipeline multi-pass (read-only, min 3)
        shell: pwsh
        run: |
          $result = & ./scripts/Invoke-PipelineMultiPass.ps1 `
            -WorkspacePath . `
            -MinPasses 3 `
            -MaxPasses 5 `
            -NoFix `
            -NoPipelineDry `
            -NoSinScan

          Write-Host "Passes run: $($result.passesRun)  Final iter: $($result.endedAtIter)"

          # Check for DRIFT-REGRESSION flag in any pass
          $regressions = @($result.passes | Where-Object {
            $_.PSObject.Properties.Name -contains 'driftRegression' -and $_.driftRegression -eq $true
          })
          if (@($regressions).Count -gt 0) {
            Write-Host "::error::DRIFT-REGRESSION detected in $(@($regressions).Count) pass(es)!"
            exit 1
          }

          Write-Host "Convergence check passed." -ForegroundColor Green

      - name: Upload convergence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-report
          path: reports/interop-iter/multipass-*.json
          retention-days: 30

  # ── Deduplication gate for todo/sin_registry/reports PRs ──────────────────
  deduplication:
    name: Deduplication Audit
    runs-on: windows-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for changed todo/sin_registry/reports paths
        id: paths
        shell: pwsh
        run: |
          git fetch --depth=1 origin ${{ github.base_ref }} 2>$null
          $changed = @(git diff --name-only FETCH_HEAD HEAD 2>$null)
          $relevant = @($changed | Where-Object { $_ -match '^(todo/|sin_registry/|reports/)' })
          "run_dedup=$($relevant.Count -gt 0)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Relevant paths changed: $($relevant.Count)"
          exit 0

      - name: Run deduplication assessment
        if: steps.paths.outputs.run_dedup == 'true'
        shell: pwsh
        run: |
          & ./scripts/Invoke-DeduplicationAssessment.ps1 -WorkspacePath .
          Write-Host "Deduplication assessment complete." -ForegroundColor Green
