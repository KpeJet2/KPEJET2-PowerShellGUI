      display: flex;

      align-items: center;
      font-size: 18px;

      gap: 8px;
      flex-wrap: wrap;

      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 9px;
      font-size: 13px;
    }

    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr 340px;
      min-height: 0;
    }

    .panel {
      border-right: 1px solid var(--border);
      overflow: auto;
      background: var(--panel);
      padding: 12px;
    }

    .panel:last-child {
      border-right: 0;
      border-left: 1px solid var(--border);
      background: #202123;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .blade-item { margin: 4px 0; }
    .blade-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--fg);
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .blade-btn:hover,
    .blade-btn.active {
      border-color: var(--border);
      background: #303036;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
    }

    .tree-toggle {
      width: 22px;
      border: 1px solid var(--border);
      background: #2b2b31;
      color: var(--fg);
      border-radius: 4px;
      cursor: pointer;
    }

    .tree-label {
      background: transparent;
      color: var(--fg);
      border: 0;
      text-align: left;
      padding: 0;
      cursor: pointer;
      font-size: 13px;
      font-family: var(--mono);
    }

    .tree-children {
      margin-left: 18px;
      border-left: 1px dashed var(--border);
      padding-left: 8px;
    }

    .status {
      font-size: 11px;
      border-radius: 12px;
      padding: 1px 7px;
      border: 1px solid var(--border);
      color: var(--sub);
    }

    .status-FAIL { color: var(--fail); }

    .detail-label { color: var(--sub); font-size: 12px; }
    .detail-value { word-break: break-word; }

    .links a {

      text-decoration: none;
    }

          a.textContent = String(node.links[i].title || node.links[i].href || 'link');
          li.appendChild(a);
          list.appendChild(li);
        }
        linksBlock.appendChild(list);
        root.appendChild(linksBlock);
      }
    }

    function render() {
      buildBladeTree();
      buildTree();
      renderDetails(null);
    }

    document.addEventListener('DOMContentLoaded', function () {
      state.model = parseModel();
      var v = String(state.model.VersionTag || 'unknown');
      byId('versionTag').textContent = 'VersionTag: ' + v + ' | Hash: ' + String(FLOW_GRAPH_HASH || 'pending');

      byId('searchInput').addEventListener('input', function () {
        state.search = String(this.value || '');
        render();
      });

      byId('statusFilter').addEventListener('change', function () {
        state.status = String(this.value || '');
        render();
      });

      render();
    });
    //]]>
  </script>
</body>
</html>
